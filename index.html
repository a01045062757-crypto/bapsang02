<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 밥상</title>
  <style>
    :root {
      --bg: #f6ecd9;          /* 한지 느낌 바탕 */
      --bg-pattern: #efe0c4;
      --ink: #3b2418;         /* 먹색에 가까운 갈색 */
      --accent: #b5452f;      /* 단청 붉은색 */
      --table: #8a4b2a;       /* 소반 나무색 */
      --table-dark: #5e3119;
      --table-light: #a8623a;
      --card: #fffaf0;
      --card-edge: #e6d3b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px;
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, var(--bg-pattern) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 60%, var(--bg-pattern) 0 2px, transparent 3px);
      background-size: 48px 48px;
    }

    header { text-align: center; }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.15em;
      color: var(--accent);
    }

    .subtitle {
      margin-top: 8px;
      font-size: 1rem;
      opacity: 0.75;
    }

    /* 둥근 소반 */
    .table {
      position: relative;
      flex-shrink: 0;
      width: min(90vw, 560px);
      height: min(90vw, 560px);
      container-type: size;   /* 카드 크기를 상 크기에 맞춤 */
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, var(--table-light), var(--table) 55%, var(--table-dark));
      border: 14px solid var(--table-dark);
      box-shadow:
        0 24px 40px rgba(59, 36, 24, 0.35),
        inset 0 0 0 4px rgba(255, 255, 255, 0.08),
        inset 0 -12px 30px rgba(0, 0, 0, 0.25);
    }

    /* 반찬 목록 */
    /* 반찬 목록: 상 위에 동그랗게 둘러놓기 (--n, --i는 아래 스크립트가 채움) */
    .dishes {
      list-style: none;
      position: absolute;
      inset: 0;
    }

    .dishes li {
      --w: min(19cqw, calc(150cqw / var(--n, 1)));   /* 반찬이 많아지면 카드가 작아짐 */
      --angle: calc(360deg / var(--n, 1) * var(--i, 0));
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--w);
      padding: calc(var(--w) * 0.14) calc(var(--w) * 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--w) * 0.07);
      background: var(--card);
      border: 2px solid var(--card-edge);
      border-radius: calc(var(--w) * 0.17);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
      font-size: calc(var(--w) * 0.15);
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      transform:
        translate(-50%, -50%)
        rotate(var(--angle))
        translateY(-31cqw)
        rotate(calc(-1 * var(--angle)));
      transition: scale 0.2s ease;
    }

    .dishes li:only-child { transform: translate(-50%, -50%); }

    .dishes li:hover { scale: 1.08; }

    /* data-emoji 값을 카드 위쪽에 크게 표시 */
    .dishes li::before {
      content: attr(data-emoji);
      font-size: calc(var(--w) * 0.38);
      line-height: 1;
    }

    footer {
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>오늘의 밥상</h1>
    <p class="subtitle">따끈한 밥 한 공기, 잘 먹겠습니다</p>
  </header>

  <main class="table">
    <ul class="dishes">
      <!-- 반찬을 추가하려면 아래에 한 줄씩 넣으세요: <li data-emoji="이모지">이름</li> -->
      <li data-emoji="🍚">밥</li>
      <li data-emoji="🍲">국</li>
      <li data-emoji="🥬">김치</li>
      <li data-emoji="🍖">꼬리곰탕</li>
      <li data-emoji="🦞">랍스타</li>
    </ul>
  </main>

  <footer>맛있게 드세요 🙏</footer>

  <script>
    // 반찬 개수와 순서를 CSS에 알려줘서 상 위에 동그랗게 배치
    const dishes = document.querySelectorAll('.dishes li');
    dishes.forEach((li, i) => {
      li.style.setProperty('--n', dishes.length);
      li.style.setProperty('--i', i);
    });
  </script>
</body>
</html>
